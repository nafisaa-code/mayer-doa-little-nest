{% extends "shell.html" %}
{% load nest %}
{% block title %}Reports{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>Daily report</h1><p>{{ day|date:"l, j F Y" }}</p></div>
  <div class="row no-print">
    {% if classes|length > 1 and not user.is_parent %}
    <form method="get"><input type="hidden" name="date" value="{{ day|date:'Y-m-d' }}">
      <select class="input" name="room" style="width:180px" data-autosubmit aria-label="Room">
        <option value="">All rooms</option>
        {% for c in classes %}<option value="{{ c.pk }}" {% if room == c.pk|stringformat:"s" %}selected{% endif %}>{{ c.name }} Room</option>{% endfor %}
      </select>
